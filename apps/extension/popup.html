<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SevaDesk Companion</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-container">
    <!-- Clean Minimalist Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-badge">S</div>
        <span class="brand-name">SevaDesk</span>
        <span class="status-indicator" id="bridgeIndicator">
          <span class="status-dot"></span>
          <span class="status-label" id="bridgeText">Connecting…</span>
        </span>
      </div>
      <div class="header-actions">
        <button id="rescanBtn" class="icon-btn" title="Rescan portal fields" aria-label="Rescan">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </button>
        <button id="toggleSettingsBtn" class="icon-btn" title="Manual payload / settings" aria-label="Settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Manual Payload Drawer (Hidden by default, zero clutter) -->
    <div id="settingsDrawer" class="settings-drawer hidden">
      <div class="drawer-header">
        <span>Manual Payload (Offline Fallback)</span>
        <button id="closeSettingsBtn" class="close-btn" aria-label="Close">✕</button>
      </div>
      <textarea id="payloadInput" spellcheck="false" placeholder="Paste SevaDesk JSON payload here if operating offline…"></textarea>
      <div class="drawer-actions">
        <button id="loadPayload" class="btn btn-primary btn-xs">Load</button>
        <button id="clearPayload" class="btn btn-quiet btn-xs">Clear</button>
        <span id="payloadStatus" class="drawer-status"></span>
      </div>
    </div>

    <!-- Hero Autofill Card -->
    <section class="hero-card">
      <div class="case-meta">
        <div class="applicant-row">
          <span class="applicant-name" id="applicantName">Waiting for Case Data</span>
          <span class="portal-chip" id="portalBadge">Detecting portal…</span>
        </div>
        <div class="service-name" id="serviceBadge">Connects automatically via local bridge</div>
      </div>

      <!-- Single Primary Action Button -->
      <button id="heroAutofillBtn" class="autofill-btn" disabled>
        <span class="btn-bolt">⚡</span>
        <span id="heroBtnTitle">Fill Form</span>
        <span class="field-pill" id="heroBtnCount">0 Fields</span>
      </button>

      <!-- Feedback / Timeout Recovery -->
      <div class="hero-feedback">
        <div id="fillResult" class="feedback-text"></div>
        <button id="reinjectPayload" class="reinject-link hidden">↺ Restore previous session</button>
      </div>
    </section>

    <!-- Matched Fields Section -->
    <section class="fields-section">
      <div class="section-header">
        <div class="header-left">
          <span class="section-title">Matched Fields</span>
          <span class="count-tag" id="mappingCountBadge">0 Ready</span>
        </div>
        <div class="header-right">
          <button id="selectAllBtn" class="link-btn">Select all</button>
          <span class="divider">·</span>
          <button id="deselectAllBtn" class="link-btn">Clear</button>
        </div>
      </div>

      <div id="mappingRows" class="fields-list">
        <div class="empty-state">
          <div class="spinner"></div>
          <p>Scanning portal form fields…</p>
        </div>
      </div>
    </section>

    <!-- Error Diagnostics Bar -->
    <section class="diagnostics-bar">
      <button id="inspectErrorsBtn" class="diagnostics-toggle">
        <span class="diag-icon">🔍</span>
        <span>Inspect On-Screen Portal Errors</span>
      </button>
      <div id="portalErrors" class="error-container hidden"></div>
    </section>

    <!-- Clean Micro-Footer -->
    <footer class="app-footer">
      <span>🔒 DPDP Safe · Zero Clipboard Leak · Human in control</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
